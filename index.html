<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AK Music Player</title><style>body{margin:0;background:#0b1020;color:#fff;font-family:Arial}.app{max-width:850px;margin:auto;padding:20px}.card{background:#151c2e;border-radius:24px;padding:24px;text-align:center}.cover{width:190px;height:190px;border-radius:20px;object-fit:cover;background:#222}.controls{display:flex;justify-content:center;gap:14px;margin:18px}button{border:0;border-radius:50%;width:52px;height:52px;font-size:20px;cursor:pointer}.play{width:64px;height:64px}.bar{width:100%}.song{display:flex;gap:12px;padding:14px;border-radius:14px;margin-top:6px;background:#151c2e;cursor:pointer}.song.active{background:#263454}.name{flex:1;text-align:left}.small{font-size:11px;color:#9ca3af}.status{font-size:13px;color:#9ca3af;margin-top:10px}.err{color:#fca5a5}</style></head><body><div class="app"><h1>🎵 AK Music Player</h1><div class="card"><img id="cover" class="cover"><h2 id="title">Loading…</h2><div id="artist">GitHub Playlist</div><input id="progress" class="bar" type="range" min="0" max="100" value="0"><div><span id="cur">0:00</span> / <span id="dur">0:00</span></div><div class="controls"><button id="prev">⏮</button><button id="play" class="play">▶</button><button id="next">⏭</button></div><input id="volume" type="range" min="0" max="1" step=".01" value=".9"><div id="status" class="status">GitHub से songs खोज रहा है…</div></div><div id="list"></div><audio id="audio" preload="metadata"></audio></div><script>
const OWNER='Ashok-Kumar-Yadaw',REPO='My-Music-File',BRANCH='main';
const audio=document.getElementById('audio'),list=document.getElementById('list'),status=document.getElementById('status');let songs=[],idx=0;
const api=p=>`https://api.github.com/repos/${OWNER}/${REPO}/contents/${p||''}`;
const raw=p=>`https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${p.split('/').map(encodeURIComponent).join('/')}`;
const fmt=s=>!isFinite(s)?'0:00':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const clean=s=>s.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
async function scan(path='',out=[]){let r=await fetch(api(path),{cache:'no-store'});if(!r.ok)throw Error('GitHub API '+r.status);let a=await r.json();for(const x of a){if(x.type==='dir')await scan(x.path,out);else if(/\.(mp3|m4a|ogg|wav|aac)$/i.test(x.name))out.push(x.path)}return out}
function render(){list.innerHTML='';songs.forEach((p,i)=>{let d=document.createElement('div');d.className='song '+(i===idx?'active':'');d.innerHTML=`<div>🎵</div><div class="name"><b>${clean(p.split('/').pop())}</b><div class="small">${p}</div></div><div>▶</div>`;d.onclick=()=>load(i,true);list.appendChild(d)})}
function load(i,auto=false){if(!songs.length)return;idx=(i+songs.length)%songs.length;let p=songs[idx];audio.src=raw(p);audio.load();document.getElementById('title').textContent=clean(p.split('/').pop());document.getElementById('cover').src='https://picsum.photos/seed/'+encodeURIComponent(p)+'/400/400';render();if(auto)audio.play().then(()=>document.getElementById('play').textContent='⏸').catch(()=>{status.textContent='Play button दबाकर चलाएँ';status.className='status err'})}
document.getElementById('play').onclick=()=>{if(!audio.src)load(0);if(audio.paused)audio.play().then(()=>{document.getElementById('play').textContent='⏸';status.textContent='Playing'}).catch(()=>status.textContent='Audio play नहीं हुआ');else{audio.pause();document.getElementById('play').textContent='▶'}};
document.getElementById('prev').onclick=()=>load(idx-1,true);document.getElementById('next').onclick=()=>load(idx+1,true);audio.onended=()=>load(idx+1,true);audio.ontimeupdate=()=>{document.getElementById('progress').value=audio.duration?audio.currentTime/audio.duration*100:0;document.getElementById('cur').textContent=fmt(audio.currentTime);document.getElementById('dur').textContent=fmt(audio.duration)};audio.onerror=()=>{status.textContent='MP3 load नहीं हुआ। GitHub file public है या नहीं जाँचें।';status.className='status err'};document.getElementById('progress').oninput=e=>{if(audio.duration)audio.currentTime=audio.duration*e.target.value/100};document.getElementById('volume').oninput=e=>audio.volume=e.target.value;
(async()=>{try{songs=await scan();songs.sort();if(!songs.length){status.textContent='Repository में MP3 नहीं मिली';return}status.textContent=songs.length+' songs मिले';load(0)}catch(e){status.textContent='GitHub से songs नहीं मिल सके: '+e.message;status.className='status err'}})();audio.volume=.9;
</script></body></html>

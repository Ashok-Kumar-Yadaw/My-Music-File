<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><meta name="description" content="AK Music Player"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>AK Music Player</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f3f6fb;color:#111827}body.dark{background:#080d18;color:#f8fafc}.app{max-width:1050px;margin:auto;padding-bottom:145px}header{position:sticky;top:0;z-index:5;padding:15px 16px;display:flex;gap:10px;align-items:center;background:#ffffffdd;backdrop-filter:blur(15px)}.dark header{background:#080d18dd}.brand{font-size:21px;font-weight:800;flex:1}button{border:0;cursor:pointer;color:inherit}.icon,.tab{padding:10px 13px;border-radius:13px;background:#e5e7eb}.dark .icon,.dark .tab{background:#1e293b}.search{padding:10px 16px}.search input{width:100%;padding:14px;border-radius:16px;border:1px solid #d1d5db;font-size:16px}.dark input{background:#111827;color:white;border-color:#334155}.hero{margin:5px 16px 18px;padding:22px;border-radius:26px;background:linear-gradient(135deg,#2563eb,#7c3aed);color:white;display:flex;gap:20px;align-items:center}.cover{width:145px;height:145px;border-radius:23px;object-fit:cover;background:#ffffff33}.hero h1{margin:5px 0;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:10px 13px;border-radius:13px}.tabs{display:flex;gap:8px;padding:0 16px 12px;overflow:auto}.tab.active{background:#2563eb;color:white}.list{padding:0 16px}.row{display:flex;align-items:center;gap:12px;padding:10px;margin:7px 0;border-radius:17px;background:white;border:1px solid #e5e7eb}.dark .row,.dark .lyricbox{background:#111827;border-color:#263244}.row.active{outline:2px solid #2563eb}.thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;background:#cbd5e1}.info{flex:1;min-width:0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{font-size:12px;opacity:.65}.heart{background:transparent;font-size:23px}.empty{text-align:center;padding:45px 15px;opacity:.7}.panel{padding:0 16px}.lyricbox{padding:20px;border-radius:20px;background:white;min-height:180px;line-height:1.9}.player{position:fixed;z-index:10;left:0;right:0;bottom:0;padding:10px 14px;background:#ffffffee;backdrop-filter:blur(16px);border-top:1px solid #ddd}.dark .player{background:#0f172aee;border-color:#334155}.bar{max-width:1050px;margin:auto}.now{display:flex;gap:10px;align-items:center}.now img{width:48px;height:48px;border-radius:12px;object-fit:cover}.nowinfo{flex:1;min-width:0}.range{width:100%;accent-color:#2563eb}.times{display:flex;justify-content:space-between;font-size:11px;opacity:.65}.controls{display:flex;justify-content:center;gap:12px}.control{width:43px;height:43px;border-radius:50%;background:#e5e7eb}.dark .control{background:#1e293b}.play{width:52px;height:52px;background:#2563eb;color:white}.install{display:none}.install.show{display:block}@media(max-width:600px){.hero{padding:15px}.cover{width:105px;height:105px}.hero h1{font-size:21px}}
</style></head><body><div class="app"><header><div class="brand">🎵 AK Music Player</div><button id="install" class="icon install">📱 Install</button><button id="theme" class="icon">🌙</button></header><div class="search"><input id="search" placeholder="गाना खोजें..."></div><section class="hero"><img id="cover" class="cover" src="icon.svg"><div style="flex:1;min-width:0"><small>NOW PLAYING</small><h1 id="heroTitle">गाना चुनें</h1><div id="heroArtist">My-Music-File</div><div class="actions"><button id="playHero">▶ Play</button><button id="shuffle">🔀 Shuffle</button><button id="repeat">🔁 Repeat: Off</button></div></div></section><nav class="tabs"><button class="tab active" data-tab="songs">🎵 Songs</button><button class="tab" data-tab="favorites">❤️ Favorites</button><button class="tab" data-tab="recent">🕘 Recently Played</button><button class="tab" data-tab="lyrics">📝 Lyrics</button></nav><main id="content"></main></div><div class="player"><div class="bar"><div class="now"><img id="miniCover" src="icon.svg"><div class="nowinfo"><div id="miniTitle" class="title">गाना चुनें</div><div id="miniSub" class="sub">My-Music-File</div></div><button id="miniFav" class="heart">♡</button></div><input id="progress" class="range" type="range" min="0" max="100" value="0"><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div><div class="controls"><button id="prev" class="control">⏮</button><button id="play" class="control play">▶</button><button id="next" class="control">⏭</button></div></div></div><audio id="audio" preload="metadata"></audio><script>
const USER='Ashok-Kumar-Yadaw',REPO='My-Music-File',BRANCH='main',RAW=`https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/`,API=`https://api.github.com/repos/${USER}/${REPO}/git/trees/${BRANCH}?recursive=1`;let songs=[],current=-1,tab='songs',shuffle=false,repeat='off';const favs=new Set(JSON.parse(localStorage.getItem('ak-favs')||'[]')),recent=()=>JSON.parse(localStorage.getItem('ak-recent')||'[]');const $=x=>document.getElementById(x),audio=$('audio');function enc(p){return p.split('/').map(encodeURIComponent).join('/')}function title(p){return p.split('/').pop().replace(/\.[^.]+$/,'')}function art(p){return RAW+enc(p.replace(/\.(mp3|m4a|ogg|wav|aac)$/i,'')+'.jpg')}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(n){if(!isFinite(n))return'0:00';return Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0')}async function load(){try{let r=await fetch(API);if(!r.ok)throw 0;let j=await r.json();songs=(j.tree||[]).filter(x=>x.type==='blob'&&/\.(mp3|m4a|ogg|wav|aac)$/i.test(x.path)).map(x=>({id:x.path,title:title(x.path),url:RAW+enc(x.path),art:art(x.path)}));render()}catch(e){$('content').innerHTML='<div class="empty">❌ Songs load नहीं हुए। GitHub repository/Internet check करें।</div>'}}function setNow(i,auto=true){if(i<0||i>=songs.length)return;current=i;let s=songs[i];audio.src=s.url;$('heroTitle').textContent=s.title;$('miniTitle').textContent=s.title;$('cover').src=s.art;$('miniCover').src=s.art;$('cover').onerror=()=>{$('cover').src='icon.svg'};$('miniCover').onerror=()=>{$('miniCover').src='icon.svg'};let r=[s.id,...recent().filter(x=>x!==s.id)].slice(0,30);localStorage.setItem('ak-recent',JSON.stringify(r));render();if(auto)audio.play().catch(()=>{});upd()}function upd(){$('play').textContent=audio.paused?'▶':'⏸';$('playHero').textContent=audio.paused?'▶ Play':'⏸ Pause';if(current>=0)$('miniFav').textContent=favs.has(songs[current].id)?'♥':'♡'}function toggle(id){favs.has(id)?favs.delete(id):favs.add(id);localStorage.setItem('ak-favs',JSON.stringify([...favs]));render();upd()}function arr(){let q=$('search').value.toLowerCase();if(tab==='favorites')return songs.filter(s=>favs.has(s.id));if(tab==='recent')return recent().map(id=>songs.find(s=>s.id===id)).filter(Boolean);return songs.filter(s=>s.title.toLowerCase().includes(q))}function render(){if(tab==='lyrics'){lyrics();return}let a=arr();$('content').innerHTML=a.length?'<div class="list">'+a.map(s=>`<div class="row ${songs[current]?.id===s.id?'active':''}" data-id="${esc(s.id)}"><img class="thumb" src="${s.art}" onerror="this.src='icon.svg'"><div class="info"><div class="title">${esc(s.title)}</div><div class="sub">My-Music-File</div></div><button class="heart" data-f="${esc(s.id)}">${favs.has(s.id)?'♥':'♡'}</button></div>`).join('')+'</div>':'<div class="empty">कोई गाना नहीं मिला।</div>';document.querySelectorAll('.row').forEach(r=>r.onclick=e=>{if(e.target.dataset.f)return;setNow(songs.findIndex(s=>s.id===r.dataset.id))});document.querySelectorAll('[data-f]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggle(b.dataset.f)})}async function lyrics(){let s=songs[current];if(!s){$('content').innerHTML='<div class="panel"><div class="lyricbox">पहले कोई गाना चलाएँ।</div></div>';return}let base=s.url.replace(/\.[^.]+$/,''),t='';for(let x of ['.lrc','.txt'])try{let r=await fetch(base+x);if(r.ok){t=await r.text();break}}catch(e){}$('content').innerHTML='<div class="panel"><div class="lyricbox">'+(t?esc(t):'इस गाने की .lrc या .txt lyrics file नहीं मिली।')+'</div></div>'}function next(){if(!songs.length)return;let n=shuffle?Math.floor(Math.random()*songs.length):(current+1)%songs.length;setNow(n)}$('play').onclick=()=>{if(current<0&&songs.length)return setNow(0);audio.paused?audio.play():audio.pause();upd()};$('playHero').onclick=()=>$('play').click();$('next').onclick=next;$('prev').onclick=()=>setNow((current-1+songs.length)%songs.length);$('shuffle').onclick=()=>{shuffle=!shuffle;$('shuffle').textContent=shuffle?'🔀 Shuffle: On':'🔀 Shuffle'};$('repeat').onclick=()=>{repeat=repeat==='off'?'all':repeat==='all'?'one':'off';$('repeat').textContent='🔁 Repeat: '+(repeat==='off'?'Off':repeat==='all'?'All':'One')};$('search').oninput=render;$('miniFav').onclick=()=>current>=0&&toggle(songs[current].id);audio.ontimeupdate=()=>{$('progress').value=audio.duration?audio.currentTime/audio.duration*100:0;$('cur').textContent=fmt(audio.currentTime);$('dur').textContent=fmt(audio.duration)};$('progress').oninput=()=>{if(audio.duration)audio.currentTime=audio.duration*$('progress').value/100};audio.onplay=upd;audio.onpause=upd;audio.onended=()=>repeat==='one'?audio.play():next();document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');tab=b.dataset.tab;render()});$('theme').onclick=()=>{document.body.classList.toggle('dark');$('theme').textContent=document.body.classList.contains('dark')?'☀️':'🌙';localStorage.setItem('ak-theme',document.body.classList.contains('dark')?'dark':'light')};if(localStorage.getItem('ak-theme')==='dark')$('theme').click();let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('install').classList.add('show')});$('install').onclick=async()=>{if(dp){await dp.prompt();dp=null}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});load();
</script></body></html>

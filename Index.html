<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AK Music Player</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111827,#312e81,#581c87);
    color:white;
    min-height:100vh;
}

.header{
    text-align:center;
    padding:25px 15px 15px;
}

.header h1{
    font-size:30px;
}

.header p{
    color:#d1d5db;
    margin-top:5px;
}

.container{
    max-width:700px;
    margin:auto;
    padding:15px;
}

.player{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:25px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
}

.album{
    width:190px;
    height:190px;
    margin:5px auto 20px;
    border-radius:50%;
    background:linear-gradient(45deg,#06b6d4,#8b5cf6,#ec4899);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:75px;
    box-shadow:0 0 40px rgba(139,92,246,.6);
}

.spin{
    animation:spin 5s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

.song-title{
    text-align:center;
    font-size:21px;
    font-weight:bold;
    margin-bottom:18px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.progress-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.progress{
    flex:1;
}

input[type="range"]{
    width:100%;
    accent-color:#a855f7;
    cursor:pointer;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:18px;
    margin:22px 0;
}

.btn{
    border:none;
    background:rgba(255,255,255,.12);
    color:white;
    width:48px;
    height:48px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.btn:hover{
    background:#8b5cf6;
    transform:scale(1.08);
}

.play{
    width:65px;
    height:65px;
    background:linear-gradient(135deg,#8b5cf6,#ec4899);
    font-size:27px;
}

.extra{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:10px 0 20px;
}

.volume{
    width:130px;
}

.search{
    width:100%;
    padding:13px 15px;
    border:none;
    border-radius:15px;
    outline:none;
    font-size:15px;
    margin-bottom:15px;
}

.playlist{
    max-height:350px;
    overflow-y:auto;
}

.song{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px;
    margin-bottom:7px;
    background:rgba(255,255,255,.07);
    border-radius:12px;
    cursor:pointer;
}

.song:hover{
    background:rgba(255,255,255,.18);
}

.song.active{
    background:linear-gradient(90deg,#7c3aed,#db2777);
}

.song-number{
    width:28px;
    text-align:center;
}

.song-name{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.status{
    text-align:center;
    padding:15px;
    color:#d1d5db;
}

.footer{
    text-align:center;
    padding:20px;
    color:#cbd5e1;
    font-size:14px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎵 AK Music Player</h1>
    <p>My Music File • GitHub Music Library</p>
</div>

<div class="container">

<div class="player">

    <div id="album" class="album">🎵</div>

    <div id="songTitle" class="song-title">
        Loading songs...
    </div>

    <div class="progress-area">
        <span id="currentTime">0:00</span>

        <div class="progress">
            <input type="range" id="progress"
                   min="0" max="100" value="0">
        </div>

        <span id="duration">0:00</span>
    </div>

    <div class="controls">

        <button class="btn" onclick="previousSong()">⏮</button>

        <button class="btn" onclick="toggleShuffle()">🔀</button>

        <button id="playBtn"
                class="btn play"
                onclick="togglePlay()">▶</button>

        <button class="btn" onclick="nextSong()">⏭</button>

        <button class="btn" onclick="toggleRepeat()">🔁</button>

    </div>

    <div class="extra">

        <span>🔊</span>

        <input class="volume"
               type="range"
               id="volume"
               min="0"
               max="1"
               step="0.01"
               value="0.8">

        <span id="mode">Normal</span>

    </div>

    <input
        class="search"
        id="search"
        type="text"
        placeholder="🔍 Search song..."
    >

    <div id="status" class="status">
        GitHub से songs loading...
    </div>

    <div id="playlist" class="playlist"></div>

</div>

</div>

<div class="footer">
    © 2026 Ashok Kumar Yadaw • AK Music Player
</div>

<audio id="audio"></audio>

<script>

// ========================================
// GITHUB SETTINGS
// ========================================

const GITHUB_USER = "Ashok-Kumar-Yadaw";
const GITHUB_REPO = "My-Music-File";
const GITHUB_BRANCH = "main";

// GitHub API
const API_URL =
`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;


// ========================================
// PLAYER VARIABLES
// ========================================

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const songTitle = document.getElementById("songTitle");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");
const playlist = document.getElementById("playlist");
const status = document.getElementById("status");
const search = document.getElementById("search");
const volume = document.getElementById("volume");
const album = document.getElementById("album");
const mode = document.getElementById("mode");

let songs = [];
let currentIndex = 0;
let isShuffle = false;
let isRepeat = false;


// ========================================
// LOAD GITHUB SONGS
// ========================================

async function loadSongs(){

    try{

        status.innerText = "🎵 GitHub से songs खोजे जा रहे हैं...";

        const response = await fetch(API_URL);

        if(!response.ok){
            throw new Error("GitHub repository access failed");
        }

        const data = await response.json();

        songs = data.tree
            .filter(file =>
                file.type === "blob" &&
                file.path.toLowerCase().endsWith(".mp3")
            )
            .map(file => {

                return {
                    name: file.path
                        .split("/")
                        .pop()
                        .replace(".mp3",""),

                    path: file.path,

                    url:
                    `https://raw.githubusercontent.com/` +
                    `${GITHUB_USER}/${GITHUB_REPO}/` +
                    `${GITHUB_BRANCH}/${encodeURI(file.path)}`
                };

            });

        if(songs.length === 0){

            status.innerText =
                "❌ कोई MP3 file नहीं मिली।";

            return;
        }

        status.innerText =
            `🎵 ${songs.length} songs मिले`;

        renderPlaylist();

        loadSong(0);

    }
    catch(error){

        console.error(error);

        status.innerHTML =
        `❌ Songs load नहीं हो सके।<br>
        Repository Public है और branch "${GITHUB_BRANCH}" है या नहीं जाँचें।`;
    }
}


// ========================================
// SHOW PLAYLIST
// ========================================

function renderPlaylist(filter = ""){

    playlist.innerHTML = "";

    const filtered = songs.filter(song =>
        song.name.toLowerCase()
        .includes(filter.toLowerCase())
    );

    filtered.forEach((song) => {

        const originalIndex =
            songs.indexOf(song);

        const div =
            document.createElement("div");

        div.className = "song";

        if(originalIndex === currentIndex){
            div.classList.add("active");
        }

        div.innerHTML = `

            <div class="song-number">
                ${originalIndex + 1}
            </div>

            <div>🎵</div>

            <div class="song-name">
                ${escapeHTML(song.name)}
            </div>

            <div>▶</div>

        `;

        div.onclick = () =>
            playSong(originalIndex);

        playlist.appendChild(div);

    });
}


// ========================================
// LOAD SONG
// ========================================

function loadSong(index){

    if(!songs.length) return;

    currentIndex = index;

    const song = songs[currentIndex];

    audio.src = song.url;

    songTitle.innerText = song.name;

    renderPlaylist(search.value);

}


// ========================================
// PLAY
// ========================================

function playSong(index){

    loadSong(index);

    audio.play();

    playBtn.innerText = "⏸";

    album.classList.add("spin");

}


// ========================================
// PLAY / PAUSE
// ========================================

function togglePlay(){

    if(!audio.src){
        playSong(0);
        return;
    }

    if(audio.paused){

        audio.play();

        playBtn.innerText = "⏸";

        album.classList.add("spin");

    }else{

        audio.pause();

        playBtn.innerText = "▶";

        album.classList.remove("spin");

    }

}


// ========================================
// NEXT
// ========================================

function nextSong(){

    if(!songs.length) return;

    let next;

    if(isShuffle){

        next =
            Math.floor(Math.random() * songs.length);

    }else{

        next = currentIndex + 1;

        if(next >= songs.length){
            next = 0;
        }

    }

    playSong(next);

}


// ========================================
// PREVIOUS
// ========================================

function previousSong(){

    if(audio.currentTime > 3){

        audio.currentTime = 0;

        return;
    }

    let previous =
        currentIndex - 1;

    if(previous < 0){
        previous = songs.length - 1;
    }

    playSong(previous);

}


// ========================================
// SHUFFLE
// ========================================

function toggleShuffle(){

    isShuffle = !isShuffle;

    mode.innerText =
        isShuffle ? "Shuffle ON" : "Normal";

}


// ========================================
// REPEAT
// ========================================

function toggleRepeat(){

    isRepeat = !isRepeat;

    mode.innerText =
        isRepeat ? "Repeat ON" :
        isShuffle ? "Shuffle ON" :
        "Normal";

}


// ========================================
// AUTO NEXT
// ========================================

audio.addEventListener("ended", () => {

    if(isRepeat){

        audio.currentTime = 0;

        audio.play();

    }else{

        nextSong();

    }

});


// ========================================
// PROGRESS
// ========================================

audio.addEventListener("timeupdate", () => {

    if(!audio.duration) return;

    const percent =
        (audio.currentTime / audio.duration) * 100;

    progress.value = percent;

    currentTime.innerText =
        formatTime(audio.currentTime);

});


audio.addEventListener("loadedmetadata", () => {

    duration.innerText =
        formatTime(audio.duration);

});


progress.addEventListener("input", () => {

    if(!audio.duration) return;

    audio.currentTime =
        (progress.value / 100) *
        audio.duration;

});


// ========================================
// VOLUME
// ========================================

volume.addEventListener("input", () => {

    audio.volume = volume.value;

});

audio.volume = 0.8;


// ========================================
// SEARCH
// ========================================

search.addEventListener("input", () => {

    renderPlaylist(search.value);

});


// ========================================
// TIME FORMAT
// ========================================

function formatTime(seconds){

    if(isNaN(seconds)) return "0:00";

    const min =
        Math.floor(seconds / 60);

    const sec =
        Math.floor(seconds % 60)
        .toString()
        .padStart(2,"0");

    return `${min}:${sec}`;

}


// ========================================
// HTML SECURITY
// ========================================

function escapeHTML(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ========================================
// START
// ========================================

loadSongs();

</script>

</body>
</html>

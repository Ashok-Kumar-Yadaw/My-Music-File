<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा म्यूजिक प्लेयर</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="player-container">
        <h2 id="title">गाने का नाम</h2>
        <h3 id="artist">कलाकार</h3>
        
        <!-- ऑडियो एलिमेंट (यहाँ सैंपल गाना लोड है) -->
        <audio id="audio" src="https://soundhelix.com"></audio>

        <!-- कंट्रोल बटन्स -->
        <div class="controls">
            <button id="prev" class="btn">⏮ Prev</button>
            <button id="play" class="btn">▶ Play</button>
            <button id="next" class="btn">⏭ Next</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
